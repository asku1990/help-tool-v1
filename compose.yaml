name: help-tool-dev

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: help_tool_v1
      POSTGRES_USER: postgres
      # Development-only credentials; the port is bound to localhost.
      POSTGRES_PASSWORD: help_tool_local
    ports:
      - '127.0.0.1:${HELP_TOOL_DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
