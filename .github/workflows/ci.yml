name: CI
on:
  pull_request:
    branches: [develop, main]

env:
  AUTH_SECRET: dummy
  AUTH_GOOGLE_ID: dummy
  AUTH_GOOGLE_SECRET: dummy
  ALLOWED_EMAILS: dummy@example.com
  TEST_BYPASS_AUTH: '1'

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - name: Run unit tests with coverage
        run: pnpm test -- --reporter=verbose

  integration:
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: '--max_old_space_size=4096'
      RUN_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - name: Verify Docker is available
        run: docker info
      - name: Run integration tests (*.int.test.*)
        run: pnpm exec vitest run .int.test. --reporter=verbose
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-integration-coverage
          path: coverage

  e2e:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    env:
      TEST_BYPASS_AUTH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm exec playwright install --with-deps
      - run: pnpm exec playwright test e2e --reporter=html
      - name: Check vehicle header menus in mobile WebKit
        run: pnpm exec playwright test --config playwright.touch.config.ts --reporter=html
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

  build:
    runs-on: ubuntu-24.04
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm build
